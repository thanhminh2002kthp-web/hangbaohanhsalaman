# Muốn bật: chép file này thành .github/workflows/deploy-edge-function.yml
# Tự deploy function admin-users lên Supabase khi code của nó thay đổi trên main.
# Cần 2 secret trong GitHub: SUPABASE_ACCESS_TOKEN và SUPABASE_PROJECT_REF.
# Chưa cấu hình secret thì job tự bỏ qua, không báo lỗi.
name: Deploy Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy admin-users
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Kiểm tra đã cấu hình secret
        id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Chưa có SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF, bỏ qua deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy admin-users --project-ref "$SUPABASE_PROJECT_REF"
